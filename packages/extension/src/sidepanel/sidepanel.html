<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Agent</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="brand">Browser Agent</div>
    <button id="settings-toggle" class="icon-btn" title="Ayarlar">⚙</button>
  </header>

  <!-- Settings drawer (hidden by default) -->
  <section id="settings" class="drawer" hidden>
    <label>Yapay zeka sağlayıcı
      <select id="provider">
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="openai">OpenAI (GPT)</option>
        <option value="gemini">Google Gemini</option>
        <option value="openrouter">OpenRouter</option>
        <option value="deepseek">DeepSeek</option>
        <option value="groq">Groq</option>
        <option value="ollama">Ollama (yerel)</option>
        <option value="custom">Özel (OpenAI uyumlu)</option>
      </select>
    </label>
    <label>API anahtarı <span id="key-hint" class="muted"></span>
      <input id="api-key" type="password" placeholder="anahtar">
    </label>
    <label id="baseurl-label" hidden>Base URL
      <input id="base-url" type="text" placeholder="http://localhost:11434/v1">
    </label>
    <label>Model (adım)
      <input id="cheap-model" type="text">
    </label>
    <input id="strong-model" type="hidden">

    <details class="advanced">
      <summary>Gelişmiş</summary>
      <label>Sürüş modu
        <select id="mode">
          <option value="cdp">CDP — gerçek mouse/klavye</option>
          <option value="content">Content script — DOM olayları</option>
        </select>
      </label>
      <label class="row-line">İzinli alan adları <span class="muted">(boş = tüm siteler)</span>
        <input id="domains" type="text" placeholder="boş = her site">
      </label>
      <label class="row-line">Maks. adım <span class="muted">(0 = sınırsız)</span>
        <input id="max-steps" type="number" value="0" min="0">
      </label>
      <label class="checkline"><input id="validate" type="checkbox"> Her adımı doğrula</label>
    </details>

    <button id="save-settings" class="primary">Kaydet</button>
  </section>

  <!-- Chat transcript -->
  <main id="chat">
    <div id="empty" class="empty">
      <p>Bir görev yaz, tarayıcıda senin için yapayım.</p>
      <p class="muted">Örn: "google'da hava durumu Ankara ara ve sonucu söyle"</p>
    </div>
  </main>

  <!-- Approval prompt (appears inline when needed) -->
  <section id="approval" class="approval" hidden>
    <p id="approval-text"></p>
    <div class="row">
      <button id="approve-yes" class="danger">Onayla</button>
      <button id="approve-no" class="ghost">Reddet</button>
    </div>
  </section>

  <!-- Composer -->
  <footer class="composer">
    <textarea id="task" rows="1" placeholder="Görev yaz…"></textarea>
    <button id="cancel" class="icon-btn" title="Durdur" hidden>■</button>
    <button id="send" class="send-btn" title="Gönder">↑</button>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
